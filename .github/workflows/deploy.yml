name: Deploy

# Deploys Monk's two registries (registry.monk.io and images.monk.io) when the Worker changes on
# the default branch. Needs the secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, plus the
# custom-domain permissions for the monk.io zone) and CLOUDFLARE_ACCOUNT_ID on the `production`
# environment. Worker secrets (USERNAME, PASSWORD) live on the Workers, not here.

on:
  push:
    branches: [monk/anonymous-pull]
    paths:
      - index.ts
      - src/**
      - wrangler.monk.jsonc
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ matrix.env }}
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: true
      max-parallel: 1 # images first: a bad build stops before it reaches registry
      matrix:
        env: [images, registry]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

      - name: Deploy
        run: pnpm exec wrangler deploy --minify --config wrangler.monk.jsonc --env ${{ matrix.env }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the registry answers
        run: |
          host=$([ "${{ matrix.env }}" = images ] && echo images.monk.io || echo registry.monk.io)
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$host/v2/") && [ "$code" = 401 ] && exit 0
            sleep 5
          done
          echo "https://$host/v2/ answered $code, expected the 401 challenge" >&2
          exit 1
